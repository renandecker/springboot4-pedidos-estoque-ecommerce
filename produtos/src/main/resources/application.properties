server.port=8081

spring.application.name=produtos-service

spring.data.jpa.repositoryFactory=default
spring.datasource.url=jdbc:h2:mem:produtosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.jpa.database.platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=grupo-produtos
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.batch-len=1